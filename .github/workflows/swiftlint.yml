name: SwiftLint

on:
  # No paths filter: a required check that a PR never triggers stays pending and blocks the merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  SwiftLint:
    runs-on: ubuntu-latest
    # Official SwiftLint image, pinned to match local development.
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint --strict
        run: swiftlint lint --strict --reporter github-actions-logging
